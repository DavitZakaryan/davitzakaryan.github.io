<style>
  :root{
    --bg:#FBF6EA; --card:#FFFFFF; --ink:#1C1917; --muted:#57534E;
    --hl:#FFD23F; --line:#E7DFC9; --field:#FFFDF6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Armenian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px}
  .langbar{display:flex; gap:8px; justify-content:center; margin:4px 0 14px}
  .langbar button{
    font:inherit; font-weight:700; font-size:14px; cursor:pointer;
    padding:8px 16px; border-radius:999px; border:2px solid var(--ink);
    background:#fff; color:var(--ink); min-height:44px;
  }
  .langbar button.active{background:var(--ink); color:#fff}
  .brand{
    text-align:center; font-family:"Noto Sans",sans-serif; font-weight:700;
    letter-spacing:.22em; font-size:12px; color:var(--muted); margin:0 0 14px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:28px 22px 26px; box-shadow:0 6px 24px rgba(28,25,23,.06);
  }
  h1{font-size:32px; line-height:1.3; font-weight:800; margin:0 0 10px; text-align:center}
  h1 mark{background:var(--hl); color:inherit; padding:2px 8px; border-radius:6px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
  .sub{text-align:center; color:var(--muted); font-size:17px; margin:0 0 8px}
  .stats{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0 4px;
  }
  .stat{
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; text-align:center; min-width:140px;
  }
  .stat b{display:block; font-size:20px; font-weight:800}
  .stat span{font-size:13px; color:var(--muted)}
  h2.sec{font-size:21px; margin:26px 0 6px}
  .secsub{color:var(--muted); font-size:15px; margin:0 0 14px}
  .pkgs{display:grid; gap:12px}
  .pkg{
    position:relative; text-align:left; width:100%; font:inherit; cursor:pointer;
    background:var(--field); border:2px solid var(--line); border-radius:16px;
    padding:16px 16px 14px; color:var(--ink);
  }
  .pkg:active{transform:translateY(1px)}
  .pkg.sel{border-color:var(--ink); background:#FFFBEF; box-shadow:0 4px 16px rgba(28,25,23,.08)}
  .pkg .badge{
    position:absolute; top:-10px; right:14px; background:var(--hl); color:var(--ink);
    font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; border:1.5px solid var(--ink);
  }
  .pkg .pname{font-weight:800; font-size:18px; margin:0 40px 4px 0}
  .pkg .pdesc{font-size:15px; color:var(--muted); margin:0 0 10px}
  .pkg .prow{display:flex; align-items:baseline; gap:8px}
  .pkg .price{font-size:24px; font-weight:800}
  .pkg .per{font-size:14px; color:var(--muted)}
  .pkg .tick{
    position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
    border:2px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:transparent;
  }
  .pkg.sel .tick{background:var(--hl); border-color:var(--ink); color:var(--ink)}
  form{border-top:2px dashed var(--line); padding-top:20px; margin-top:26px}
  .fld{margin-bottom:18px}
  label{display:block; font-weight:700; font-size:16px; margin-bottom:6px}
  label .opt{font-weight:400; color:var(--muted); font-size:14px}
  .hint{font-size:14px; color:var(--muted); margin:6px 0 0}
  input[type="tel"],input[type="text"],input[type="email"],select,textarea{
    width:100%; font:inherit; font-size:17px; color:var(--ink);
    background:var(--field); border:2px solid var(--line); border-radius:12px;
    padding:14px 14px; min-height:54px; appearance:none;
  }
  textarea{min-height:96px; resize:vertical}
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%231C1917' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 16px center; padding-right:42px;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--ink)}
  .summary{
    background:var(--bg); border:2px solid var(--ink); border-radius:14px; padding:16px;
    margin-bottom:18px;
  }
  .summary .srow{display:flex; justify-content:space-between; gap:12px; font-size:16px; margin-bottom:4px}
  .summary .srow span:first-child{color:var(--muted)}
  .summary .stotal{display:flex; justify-content:space-between; gap:12px; font-size:20px; font-weight:800; border-top:2px dashed var(--line); padding-top:10px; margin-top:8px}
  .consent{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  .consent input[type="checkbox"]{width:24px; height:24px; flex:0 0 auto; margin-top:2px; accent-color:var(--ink)}
  .consent span{font-size:15px; font-weight:400}
  .submit{
    width:100%; font:inherit; font-weight:800; font-size:19px; cursor:pointer;
    background:var(--hl); color:var(--ink); border:2px solid var(--ink); border-radius:14px;
    padding:16px; min-height:60px; margin-top:20px;
  }
  .submit:active{transform:translateY(1px)}
  .small{font-size:14px; color:var(--muted); text-align:center; margin:18px 0 0}
  .small a{color:var(--ink); font-weight:600}
</style>

function updateSummary(){
  var p = PACKAGES[curPkg];
  var d = I18N[curLang];
  var qsel = document.getElementById("quantity");
  var q = p.qty ? parseInt(qsel.value, 10) : 1;
  if(!p.qty) qsel.value = "1";
  document.getElementById("qtyfld").style.display = p.qty ? "" : "none";
  document.getElementById("sum_name").textContent = d[p.nameKey];
  var dur = d[p.perKey];
  if(p.qty && q > 1) dur = dur + " × " + q;
  document.getElementById("sum_dur").textContent = dur;
  var total = p.price * q;
  document.getElementById("sum_total").textContent = "$" + total;
  document.getElementById("f_total").value = total;
}

function selectPkg(id, scroll){
  if(!PACKAGES[id]) id = "afisha";
  curPkg = id;
  var cards = document.querySelectorAll(".pkg");
  for(var i = 0; i < cards.length; i++){
    cards[i].classList.toggle("sel", cards[i].getAttribute("data-pkg") === id);
  }
  var sel = document.getElementById("package");
  for(var j = 0; j < sel.options.length; j++){
    if(sel.options[j].getAttribute("data-pkg") === id){ sel.selectedIndex = j; break; }
  }
  updateSummary();
  if(scroll){
    document.getElementById("adform").scrollIntoView({behavior:"smooth", block:"start"});
  }
}

function applyLang(lang){
  if(!I18N[lang]) lang = "hy";
  curLang = lang;
  var d = I18N[lang];
  document.documentElement.lang = lang;
  document.title = d.pageTitle;
  var els = document.querySelectorAll("[data-i18n]");
  for(var i = 0; i < els.length; i++){
    var k = els[i].getAttribute("data-i18n");
    if(d[k] !== undefined) els[i].textContent = d[k];
  }
  var phs = document.querySelectorAll("[data-i18n-ph]");
  for(var j = 0; j < phs.length; j++){
    var pk = phs[j].getAttribute("data-i18n-ph");
    if(d[pk] !== undefined) phs[j].setAttribute("placeholder", d[pk]);
  }
  var btns = document.querySelectorAll("[data-setlang]");
  for(var b = 0; b < btns.length; b++){
    btns[b].classList.toggle("active", btns[b].getAttribute("data-setlang") === lang);
  }
  try{ localStorage.setItem("forma-lang", lang); }catch(e){}
  updateSummary();
}

var saved = "hy";
try{ saved = localStorage.getItem("forma-lang") || "hy"; }catch(e){}
applyLang(saved);
selectPkg("afisha", false);

var pkgBtns = document.querySelectorAll(".pkg");
for(var x = 0; x < pkgBtns.length; x++){
  pkgBtns[x].addEventListener("click", function(){
    selectPkg(this.getAttribute("data-pkg"), false);
  });
}
document.getElementById("package").addEventListener("change", function(){
  var opt = this.options[this.selectedIndex];
  selectPkg(opt.getAttribute("data-pkg"), false);
});
document.getElementById("quantity").addEventListener("change", updateSummary);

var langBtns = document.querySelectorAll("[data-setlang]");
for(var y = 0; y < langBtns.length; y++){
  langBtns[y].addEventListener("click", function(){
    applyLang(this.getAttribute("data-setlang"));
  });
}
