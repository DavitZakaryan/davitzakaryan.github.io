function applyLang(lang){
  if(!I18N[lang]) lang = "hy";
  var d = I18N[lang];
  document.documentElement.lang = lang;
  document.title = d.pageTitle;
  var els = document.querySelectorAll("[data-i18n]");
  for(var i = 0; i < els.length; i++){
    var k = els[i].getAttribute("data-i18n");
    if(d[k] !== undefined) els[i].textContent = d[k];
  }
  var phs = document.querySelectorAll("[data-i18n-ph]");
  for(var j = 0; j < phs.length; j++){
    var pk = phs[j].getAttribute("data-i18n-ph");
    if(d[pk] !== undefined) phs[j].setAttribute("placeholder", d[pk]);
  }
  var btns = document.querySelectorAll("[data-setlang]");
  for(var b = 0; b < btns.length; b++){
    btns[b].classList.toggle("active", btns[b].getAttribute("data-setlang") === lang);
  }
  try{ localStorage.setItem("forma-lang", lang); }catch(e){}
}

var saved = "hy";

for(var x = 0; x < langBtns.length; x++){
  langBtns[x].addEventListener("click", function(){
    applyLang(this.getAttribute("data-setlang"));

}
