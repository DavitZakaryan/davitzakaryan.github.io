<!DOCTYPE html>
<html lang="hy">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GH97HNWM0C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-GH97HNWM0C');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Շնորհակալություն — LA Armenian News · Sitvio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBF6EA; --card:#FFFFFF; --ink:#1C1917; --muted:#57534E; --hl:#FFD23F; --line:#E7DFC9; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Armenian","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px}
  .langbar{display:flex; gap:8px; justify-content:center; margin:4px 0 14px}
  .langbar button{
    font:inherit; font-weight:700; font-size:14px; cursor:pointer;
    padding:8px 16px; border-radius:999px; border:2px solid var(--ink);
    background:#fff; color:var(--ink); min-height:44px;
  }
  .langbar button.active{background:var(--ink); color:#fff}
  .brand{
    text-align:center; font-family:"Noto Sans",sans-serif; font-weight:700;
    letter-spacing:.22em; font-size:12px; color:var(--muted); margin:0 0 14px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:36px 22px 30px; box-shadow:0 6px 24px rgba(28,25,23,.06); text-align:center;
  }
  .check{
    width:76px; height:76px; border-radius:50%; background:var(--hl);
    margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
  }
  .check svg{width:40px; height:40px}
  h1{font-size:28px; line-height:1.25; font-weight:800; margin:0 0 10px}
  p.line{font-size:17px; color:var(--muted); margin:0 0 22px}
  a.back{color:var(--ink); font-weight:700; font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar" role="group" aria-label="Language / Լեզու">
    <button type="button" data-setlang="hy">ՀԱՅ</button>
    <button type="button" data-setlang="ru">RU</button>
    <button type="button" data-setlang="en">EN</button>
    <button type="button" data-setlang="es">ES</button>
  </div>

  <p class="brand">LA ARMENIAN NEWS · SITVIO</p>

  <div class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.2 5.2L20 6.5" stroke="#1C1917" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1 data-i18n="thanksTitle"></h1>
    <p class="line" data-i18n="thanksLine"></p>
    <a class="back" href="index.html" data-i18n="backLink"></a>
  </div>
</div>

<script>
var I18N = {
  hy: {
    pageTitle: "Շնորհակալություն — LA Armenian News · Sitvio",
    thanksTitle: "Շնորհակալություն։ Հայտը ստացված է։",
    thanksLine: "Մասնագետը կզանգի ձեզ հնարավորինս շուտ։",
    backLink: "Վերադառնալ գլխավոր էջ"
  },
  ru: {
    pageTitle: "Спасибо — LA Armenian News · Sitvio",
    thanksTitle: "Спасибо! Заявка получена.",
    thanksLine: "Специалист позвонит вам в ближайшее время.",
    backLink: "Вернуться на главную"
  },
  en: {
    pageTitle: "Thank you — LA Armenian News · Sitvio",
    thanksTitle: "Thank you! Your request has been received.",
    thanksLine: "A professional will call you shortly.",
    backLink: "Back to the form"
  },
  es: {
    pageTitle: "Gracias — LA Armenian News · Sitvio",
    thanksTitle: "¡Gracias! Su solicitud ha sido recibida.",
    thanksLine: "Un profesional le llamará pronto.",
    backLink: "Volver al formulario"
  }
};

function applyLang(lang){
  if(!I18N[lang]) lang = "hy";
  var d = I18N[lang];
  document.documentElement.lang = lang;
  document.title = d.pageTitle;
  var els = document.querySelectorAll("[data-i18n]");
  for(var i = 0; i < els.length; i++){
    var k = els[i].getAttribute("data-i18n");
    if(d[k] !== undefined) els[i].textContent = d[k];
  }
  var btns = document.querySelectorAll("[data-setlang]");
  for(var b = 0; b < btns.length; b++){
    btns[b].classList.toggle("active", btns[b].getAttribute("data-setlang") === lang);
  }
  try{ localStorage.setItem("forma-lang", lang); }catch(e){}
}

var saved = "hy";
try{ saved = localStorage.getItem("forma-lang") || "hy"; }catch(e){}
applyLang(saved);

var langBtns = document.querySelectorAll("[data-setlang]");
for(var x = 0; x < langBtns.length; x++){
  langBtns[x].addEventListener("click", function(){
    applyLang(this.getAttribute("data-setlang"));
  });
}
</script>
</body>
</html>
